{% extends 'base.html' %}
{% block title %}Add Spot - ParkEasy{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-primary">Add New Spot to {{ lot.name }}</h2>
        <a href="{{ url_for('manage_spots', lot_id=lot.id) }}" class="btn btn-outline-secondary rounded-pill">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>

    <form method="POST">
        {{ form.hidden_tag() }}

        <div class="mb-3">
            <label for="spot_number" class="form-label">Spot Number</label>
            {{ form.spot_number(class="form-control", id="spot_number", placeholder="Enter spot number") }}
        </div>

        <div class="text-end">
            <button type="submit" class="btn btn-success rounded-pill">
                <i class="bi bi-check-circle"></i> Add Spot
            </button>
        </div>
    </form>
</div>
{% endblock %}
