<!-- templates/view_spots.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Parking Spots - {{ lot.name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
  <div class="container mt-5">
    <h3>Spots in {{ lot.name }}</h3>
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary mb-3">← Back</a>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Spot Number</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        {% for spot in spots %}
        <tr>
          <td>{{ spot.number }}</td>
          <td>{{ 'Occupied' if spot.is_occupied else 'Available' }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
